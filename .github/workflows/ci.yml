name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The shipped dependency tree must be whole (no package resolved at a version its dependents do not accept),
      # and no dependency may carry a high or critical advisory.
      - name: Dependency tree
        run: npm ls --omit=dev --all > /dev/null

      - name: Known advisories
        run: npm audit --audit-level=high

      - name: Changelog links
        run: node scripts/check-changelog.mjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build (verify bundles)
        # Cross-platform bundle steps only — signing/notarization (electron-builder)
        # runs locally via scripts/release.sh, never in CI.
        run: |
          npx vite build
          npm run build:main
          npm run build:preload
          npm run build:mcp
