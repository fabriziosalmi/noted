name: E2E

# Drives the real Electron app (Playwright `_electron`) on all three desktop
# platforms: open a vault, edit, rename, search, quit-flush, and the update
# check. Runs against the built bundles; installers are not built here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Flake hunting: run a subset many times (Actions -> E2E -> Run workflow).
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only tests whose title matches this (blank = all)'
        required: false
        default: ''
      repeat:
        description: 'Run each selected test this many times'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build:bundles

      # Electron needs a display on Linux runners.
      # Inputs are only set for a manual run; on push/PR they are empty and this
      # is a plain `npm run test:e2e`.
      - name: Run E2E (Linux, under xvfb)
        if: runner.os == 'Linux'
        env:
          E2E_GREP: ${{ inputs.grep }}
          E2E_REPEAT: ${{ inputs.repeat }}
        run: xvfb-run --auto-servernum npm run test:e2e -- ${E2E_GREP:+--grep "$E2E_GREP"} ${E2E_REPEAT:+--repeat-each="$E2E_REPEAT"}

      - name: Run E2E
        if: runner.os != 'Linux'
        shell: bash
        env:
          E2E_GREP: ${{ inputs.grep }}
          E2E_REPEAT: ${{ inputs.repeat }}
        run: npm run test:e2e -- ${E2E_GREP:+--grep "$E2E_GREP"} ${E2E_REPEAT:+--repeat-each="$E2E_REPEAT"}

      # Screenshots of the window at the moment of failure live in the HTML
      # report and in test-results/; traces are kept for failed tests.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
