# Proposes updates as pull requests; nothing merges by itself. Security updates for a known advisory come as soon as
# it is published, version updates once a week, grouped so the editor packages move together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tiptap:
        patterns: ['@tiptap/*']
      # react-dom requires the same react, and the types follow them.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    ignore:
      # jsdom 30 needs Node 22.22.2 or later, and the MCP server for Claude Desktop runs on the user's own `node`.
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
      # @tiptap/extension-mathematics accepts katex ^0.16.4 || ^0.17.0 || ^0.18.0.
      - dependency-name: katex
        versions: ['>=0.19.0']
  - package-ecosystem: npm
    directory: /mcp-server/runtime
    schedule:
      interval: weekly
    ignore:
      # jsdom 30 needs Node 22.22.2 or later, and the MCP server for Claude Desktop runs on the user's own `node`.
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
