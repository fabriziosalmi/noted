<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background with smooth gradient and soft shadow -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" /> <!-- Blue 600 -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Blue 500 -->
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- App Icon Base Shape (Squircle approximation) -->
  <rect x="112" y="112" width="800" height="800" rx="200" fill="url(#bgGradient)" filter="url(#softShadow)" />

  <!-- The Check/Pen Shape -->
  <g transform="translate(220, 260)">
    <!-- Short stroke of the check mark -->
    <path d="M 100 350 L 250 500" fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Long stroke of the check mark (The Pen Body) -->
    <path d="M 250 500 L 480 200" fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pen Nib/Tip -->
    <path d="M 480 200 L 570 80 L 540 240 Z" fill="#FFFFFF" />
    
    <!-- The slit in the pen nib -->
    <path d="M 525 150 L 480 200" fill="none" stroke="#2563EB" stroke-width="12" stroke-linecap="round" />
    
    <!-- Pen body decorative cut -->
    <path d="M 410 240 L 460 310" fill="none" stroke="#2563EB" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>