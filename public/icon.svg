<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Noted">
  <defs>
    <linearGradient id="bg" x1="180" y1="140" x2="880" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="pen" x1="690" y1="310" x2="384" y2="616" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
  </defs>

  <!-- macOS-style squircle -->
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#bg)"/>

  <!-- Diagonal pen: rounded barrel + pointed nib -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <line x1="690" y1="310" x2="470" y2="530" stroke="url(#pen)" stroke-width="78"/>
    <path d="M496.9 556.9 L443.1 503.1 L384 616 Z" fill="url(#pen)"/>
    <!-- ink slit + breather hole -->
    <line x1="470" y1="530" x2="398" y2="602" stroke="#4338CA" stroke-width="11"/>
    <circle cx="474" cy="526" r="13" fill="#4338CA"/>
  </g>

  <!-- The mark it just wrote: underline below -->
  <line x1="372" y1="702" x2="690" y2="702" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
</svg>
