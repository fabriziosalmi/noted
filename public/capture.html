<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Quick Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      -webkit-app-region: drag;
    }
    .header button { -webkit-app-region: no-drag; background: none; border: none; color: #6b7280; cursor: pointer; font-size: 16px; line-height: 1; }
    textarea {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #f3f4f6;
      font-size: 14px;
      line-height: 1.6;
      padding: 10px 12px;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    textarea:focus { border-color: #6366f1; }
    textarea::placeholder { color: #4b5563; }
    .footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #4b5563;
    }
    .save-btn {
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .save-btn:hover { background: #4f46e5; }
    .target { display: flex; align-items: center; gap: 6px; margin-right: auto; }
    select {
      background: #0f0f1a; border: 1px solid #374151; border-radius: 6px; color: #e5e7eb;
      font-size: 12px; padding: 3px 6px; font-family: inherit; outline: none;
    }
    select:focus { border-color: #6366f1; }
  </style>
</head>
<body>
  <div class="header">
    <span>⚡ <span id="title">Quick Capture</span></span>
    <button id="close" aria-label="Close">×</button>
  </div>
  <textarea id="note" placeholder="Write here…" autofocus></textarea>
  <div class="footer">
    <label class="target"><span id="target-label">Save to</span>
      <select id="target">
        <option value="new">A new note</option>
        <option value="daily">Today's daily note</option>
        <option value="inbox">Inbox note</option>
      </select>
    </label>
    <span id="hint">⌘↩ save · Esc close</span>
    <button class="save-btn" id="save">Save</button>
  </div>
  <script src="capture.js"></script>
</body>
</html>
